services:
  activation-manager:
    image: ${DOCKER_IMAGE:-ghcr.io/zhuixin8/program-management:latest}
    container_name: activation-manager
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${HOST_PORT:-3010}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.server}
      ALLOWED_IPS: ${ALLOWED_IPS:-*}
      LICENSE_V2_OFFLINE_PRIVATE_KEY_PEM: ${LICENSE_V2_OFFLINE_PRIVATE_KEY_PEM:-}
      LICENSE_V2_OFFLINE_PRIVATE_KEY_BASE64: ${LICENSE_V2_OFFLINE_PRIVATE_KEY_BASE64:-}
      LICENSE_V2_OFFLINE_PUBLIC_KEY: ${LICENSE_V2_OFFLINE_PUBLIC_KEY:-}
      LICENSE_V2_OFFLINE_LICENSE_TTL_SECONDS: ${LICENSE_V2_OFFLINE_LICENSE_TTL_SECONDS:-86400}
    volumes:
      - ${DATA_DIR:-/opt/activation-manager-data}:/app/data
